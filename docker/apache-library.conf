<Directory /var/www/html>
    AllowOverride All
    Options -Indexes
    Require all granted
    DirectoryIndex TheGameLibrary.html
</Directory>

Alias /covers/ /data/covers/
<Directory /data/covers>
    AllowOverride None
    Options -Indexes
    Require all granted
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>
