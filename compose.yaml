services:
  game-library:
    image: droidkid/thegamelibrary:${GAME_LIBRARY_VERSION:-latest}
    restart: unless-stopped
    init: true
    ports:
      - "${GAME_LIBRARY_PORT:-8080}:80"
    environment:
      GAME_LIBRARY_DATA_DIR: /data
      THEGAMESDB_KEY_FILE: /data/thegamesdb-key
    volumes:
      - library-data:/data
      - ./config:/run/game-library-config:ro,Z
    security_opt:
      - no-new-privileges:true

volumes:
  library-data:
